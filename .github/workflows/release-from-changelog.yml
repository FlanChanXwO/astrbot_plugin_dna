name: Release from Changelog

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: "可选的 tag 前缀；留空时使用 v"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-from-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse Changelog
        id: parse
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        shell: bash
        run: |
          set -euo pipefail

          changelog_path="CHANGELOG.md"
          first_heading_line="$(grep -n -m1 -E '^##[[:space:]]*\[?v?[0-9]+\.[0-9]+\.[0-9]+([-.+][^]]+)?\]?.*$' "$changelog_path" || true)"
          if [ -z "$first_heading_line" ]; then
            echo "CHANGELOG.md 中没有可解析的 SemVer 版本 heading。" >&2
            exit 1
          fi

          start_line="${first_heading_line%%:*}"
          heading_text="${first_heading_line#*:}"
          version="$(printf '%s\n' "$heading_text" | sed -E 's/^##[[:space:]]*\[?v?([^]]+)\]?.*$/\1/')"
          if ! printf '%s\n' "$version" | grep -q -E '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "无法从 CHANGELOG.md heading 解析正式版本：$heading_text" >&2
            exit 1
          fi

          next_heading_rel="$(tail -n +$((start_line + 1)) "$changelog_path" \
            | grep -n -m1 -E '^##[[:space:]]*\[?v?[0-9]+\.[0-9]+\.[0-9]+([-.+][^]]+)?\]?.*$' \
            | cut -d: -f1 || true)"
          notes_start=$((start_line + 1))
          if [ -n "$next_heading_rel" ]; then
            notes_end=$((start_line + next_heading_rel - 1))
            notes="$(sed -n "${notes_start},${notes_end}p" "$changelog_path")"
          else
            notes="$(sed -n "${notes_start},\$p" "$changelog_path")"
          fi
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md 的版本段落为空。" >&2
            exit 1
          fi

          if [ -n "${TAG_PREFIX:-}" ]; then
            tag="${TAG_PREFIX}${version}"
          else
            tag="v${version}"
          fi
          notes_file="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$notes" > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "生成的 release notes 文件为空。" >&2
            exit 1
          fi

          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'notes_file=%s\n' "$notes_file"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.parse.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ steps.parse.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE"
            echo "Updated release $RELEASE_TAG"
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi
          echo "Created release $RELEASE_TAG"

      - name: Verify release body
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.parse.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "Release $RELEASE_TAG 的正文为空。" >&2
            exit 1
          fi
