name: 从更新日志同步发布说明

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - scripts/ci/release_notes.py
      - .github/workflows/release-from-changelog.yml
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: "可选的标签前缀；留空时直接使用 vX.Y.Z"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-from-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 生成全部版本发布说明
        env:
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release_notes.py \
            --changelog CHANGELOG.md \
            --tag-prefix "${TAG_PREFIX:-}" \
            --all-output-dir "$RUNNER_TEMP/release-notes" \
            --manifest "$RUNNER_TEMP/release-manifest.tsv"

      - name: 登录 GitHub CLI
        env:
          GH_AUTH_VALUE: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GH_AUTH_VALUE" | gh auth login --hostname github.com --with-token

      - name: 同步全部 GitHub Release
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/release-manifest.tsv
        shell: bash
        run: |
          set -euo pipefail

          latest=true
          while IFS=$'\t' read -r release_tag release_notes_file; do
            if [ -z "$release_tag" ]; then
              continue
            fi
            if [ ! -s "$release_notes_file" ]; then
              echo "版本 $release_tag 的发布说明为空。" >&2
              exit 1
            fi

            if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$release_tag" \
                --notes-file "$release_notes_file"
              echo "已更新 Release $release_tag"
            elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" >/dev/null 2>&1; then
              gh release create "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$release_tag" \
                --notes-file "$release_notes_file"
              echo "已从现有标签创建 Release $release_tag"
            elif [ "$latest" = true ]; then
              gh release create "$release_tag" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "$release_tag" \
                --notes-file "$release_notes_file"
              echo "已为最新版本创建 Release $release_tag"
            else
              echo "历史版本 $release_tag 缺少对应 Git 标签，拒绝指向当前提交创建。" >&2
              exit 1
            fi

            body="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""')"
            if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              echo "Release $release_tag 的正文为空。" >&2
              exit 1
            fi
            latest=false
          done < "$RELEASE_MANIFEST"
