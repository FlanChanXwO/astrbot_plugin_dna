name: Checkin baseline comparison

on:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install AstrBot and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/AstrBotDevs/AstrBot.git "$RUNNER_TEMP/astrbot"
          python -m pip install --disable-pip-version-check -e "$RUNNER_TEMP/astrbot"
          python -m pip install --disable-pip-version-check -r requirements.txt pytest pytest-asyncio

      - name: Reproduce unrelated baseline failures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/.data
          python -m pytest -q \
            tests/test_checkin.py::test_auto_sign_credential_expiry_is_not_group_failure \
            tests/test_checkin.py::test_auto_sign_report_groups_game_and_community_by_group
