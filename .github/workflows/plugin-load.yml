name: AstrBot plugin lifecycle

on:
  pull_request:

permissions:
  contents: read

jobs:
  plugin-lifecycle:
    name: AstrBot plugin lifecycle (${{ matrix.source }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source:
          - stable
          - master
    env:
      ASTRBOT_REPOSITORY: https://github.com/AstrBotDevs/AstrBot.git
      SOURCE_KIND: ${{ matrix.source }}
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 后续步骤会执行 PR 提交中的依赖构建和插件代码，不能留下 GitHub token。
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve official AstrBot source
        id: astrbot-ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_KIND" == "stable" ]]; then
            git ls-remote --tags --refs "$ASTRBOT_REPOSITORY" \
              | awk -F/ '{print $3}' > "$RUNNER_TEMP/astrbot-tags.txt"
            python - "$RUNNER_TEMP/astrbot-tags.txt" > "$RUNNER_TEMP/astrbot-ref.txt" <<'PY'
          from importlib.util import module_from_spec, spec_from_file_location
          from pathlib import Path
          import sys

          script = Path("scripts/ci/check_astrbot_plugin_load.py").resolve()
          spec = spec_from_file_location("dnaby_loader", script)
          if spec is None or spec.loader is None:
              raise RuntimeError(f"无法加载 stable 版本解析器: {script}")
          module = module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          tags = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          print(module.select_latest_stable_version(tags))
          PY
          elif [[ "$SOURCE_KIND" == "master" ]]; then
            printf '%s\n' master > "$RUNNER_TEMP/astrbot-ref.txt"
          else
            printf '未知的 AstrBot 来源: %s\n' "$SOURCE_KIND" >&2
            exit 1
          fi
          ref="$(cat "$RUNNER_TEMP/astrbot-ref.txt")"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout official AstrBot
        env:
          ASTRBOT_SOURCE: ${{ runner.temp }}/astrbot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch \
            --branch "${{ steps.astrbot-ref.outputs.ref }}" \
            "$ASTRBOT_REPOSITORY" "$ASTRBOT_SOURCE"

      - name: Install official and plugin dependencies
        env:
          ASTRBOT_SOURCE: ${{ runner.temp }}/astrbot
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e "$ASTRBOT_SOURCE"
          python -m pip install --disable-pip-version-check -r "$GITHUB_WORKSPACE/requirements.txt"

      - name: Run lifecycle cleanup contract tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/test_goal5_loader_cleanup_contracts.py -v
          python tests/test_goal5_web_lifecycle.py -v

      - name: Run official PluginManager lifecycle check
        env:
          ASTRBOT_SOURCE: ${{ runner.temp }}/astrbot
          ASTRBOT_VERSION: "${{ matrix.source }}:${{ steps.astrbot-ref.outputs.ref }}"
          ASTRBOT_ROOT: ${{ runner.temp }}/dnaby-astrbot-root-${{ matrix.source }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/check_astrbot_plugin_lifecycle.py \
            --astrbot-source "$ASTRBOT_SOURCE" \
            --astrbot-version "$ASTRBOT_VERSION" \
            --plugin-dir "$GITHUB_WORKSPACE" \
            --astrbot-root "$ASTRBOT_ROOT" \
            --plugin-name astrbot_plugin_dnaby
