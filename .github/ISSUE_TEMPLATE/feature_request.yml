name: 功能建议
title: "Feature: 请填写功能名称"
description: 提出能改善 DNABY 使用体验的功能建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前使用流程中的痛点，以及受到影响的场景。
    validations:
      required: true

  - type: textarea
    id: feature
    attributes:
      label: 功能方案
      description: 说明你希望新增或调整的行为，并给出命令、配置或交互示例。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 如果有现有 workaround 或其他实现方案，请一并说明。
    validations:
      required: false
